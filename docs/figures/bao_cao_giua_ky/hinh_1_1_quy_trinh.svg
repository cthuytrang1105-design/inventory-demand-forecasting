<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="black"/></marker></defs><rect width="1500" height="900" fill="white"/><rect x="60" y="40" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="255.0" y="87.0" text-anchor="middle" font-family="Times New Roman" font-size="30">1. Dữ liệu CSV</text><text x="255.0" y="123.0" text-anchor="middle" font-family="Times New Roman" font-size="30">Lịch sử có nhãn sales</text><rect x="555" y="40" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="750.0" y="87.0" text-anchor="middle" font-family="Times New Roman" font-size="30">2. Kiểm tra dữ liệu</text><text x="750.0" y="123.0" text-anchor="middle" font-family="Times New Roman" font-size="30">Ngày, khóa, sales</text><rect x="1050" y="40" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="1245.0" y="87.0" text-anchor="middle" font-family="Times New Roman" font-size="30">3. Tạo đặc trưng</text><text x="1245.0" y="123.0" text-anchor="middle" font-family="Times New Roman" font-size="30">Lag, rolling, lịch</text><rect x="60" y="255" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="255.0" y="302.0" text-anchor="middle" font-family="Times New Roman" font-size="30">EDA toàn bộ dữ liệu</text><text x="255.0" y="338.0" text-anchor="middle" font-family="Times New Roman" font-size="30">Xu hướng, phân phối</text><rect x="1050" y="470" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="1245.0" y="517.0" text-anchor="middle" font-family="Times New Roman" font-size="30">4. Train và tuning</text><text x="1245.0" y="553.0" text-anchor="middle" font-family="Times New Roman" font-size="30">Chấm trên validation</text><rect x="555" y="470" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="750.0" y="517.0" text-anchor="middle" font-family="Times New Roman" font-size="30">5. Khóa lựa chọn</text><text x="750.0" y="553.0" text-anchor="middle" font-family="Times New Roman" font-size="30">WAPE validation nhỏ nhất</text><rect x="60" y="470" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="255.0" y="517.0" text-anchor="middle" font-family="Times New Roman" font-size="30">6. Đánh giá test</text><text x="255.0" y="553.0" text-anchor="middle" font-family="Times New Roman" font-size="30">Holdout 30 ngày</text><rect x="60" y="710" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="255.0" y="757.0" text-anchor="middle" font-family="Times New Roman" font-size="30">7. Refit và lưu model</text><text x="255.0" y="793.0" text-anchor="middle" font-family="Times New Roman" font-size="30">Sau khi đánh giá test</text><rect x="555" y="710" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="750.0" y="757.0" text-anchor="middle" font-family="Times New Roman" font-size="30">8. Dự báo nhiều bước</text><text x="750.0" y="793.0" text-anchor="middle" font-family="Times New Roman" font-size="30">Model đã lưu + lịch sử</text><rect x="1050" y="710" width="390" height="110" fill="white" stroke="black" stroke-width="2"/><text x="1245.0" y="757.0" text-anchor="middle" font-family="Times New Roman" font-size="30">9. Gợi ý nhập hàng</text><text x="1245.0" y="793.0" text-anchor="middle" font-family="Times New Roman" font-size="30">Dự báo + tồn người dùng nhập</text><path d="M450 95 H550" stroke="black" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M945 95 H1045" stroke="black" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M255 150 V250" stroke="black" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 7"/><path d="M1245 150 V465" stroke="black" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1050 525 H950" stroke="black" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M555 525 H455" stroke="black" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M255 580 V705" stroke="black" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M450 765 H550" stroke="black" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M945 765 H1045" stroke="black" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="745" y="636" text-anchor="middle" font-family="Times New Roman" font-size="28">Test chỉ chạy sau khi đã khóa lựa chọn mô hình.</text><text x="750" y="875" text-anchor="middle" font-family="Times New Roman" font-size="25">EDA mô tả toàn bộ CSV; thực nghiệm ML dùng 162 chuỗi đã chọn.</text></svg>